# MiniOS FLTUBE-AP-01 — first-run defaults for Gateway MA3
STREAM_PLAYER_PATH = minios-mplayer
STREAM_PLAYER_PARAMS = -zoom -vo x11 -ao alsa,oss,null -demuxer lavf -user-agent Mozilla/5.0
STREAM_PLAYER_EXTRA_PARAMS_FOR_LIVE = -demuxer lavf -cache 2048
STREAM_VIDEO_RESOLUTION = 240
CACHE_PATH = /tmp/fltube-cache
RESOURCES_PATH = /usr/local/share/fltube/resources
AVOID_INITIAL_VERIFICATIONS = true
ENABLE_ALTERNATIVE_STREAM_METHOD = false
